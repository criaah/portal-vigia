  function avisoSinLlave() {
    var pinta = function () { var el = document.getElementById('app') || document.getElementById('caja'); if (!el) return;
      el.innerHTML = '<div style="max-width:440px;margin:40px auto;background:#fff;border:1px solid #D5DBE1;border-radius:14px;padding:22px;text-align:center;font:15px/1.5 system-ui,sans-serif;color:#1D2733">' +
        '<div style="font-size:19px;font-weight:700;color:#0E2A47;margin-bottom:6px">Entre por el enlace del equipo</div>' +
        '<p style="margin:0 0 16px">Para abrir el portal en este dispositivo, use una vez el enlace corto. Después queda guardado.</p>' +
        '<a href="https://tinyurl.com/portalvigia" style="display:inline-block;background:#1B7A86;color:#fff;text-decoration:none;font-weight:700;border-radius:10px;padding:12px 18px">Abrir tinyurl.com/portalvigia</a></div>'; };
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', pinta); else pinta();
  }
  function runner(ok, mal) {
    return new Proxy({}, {get: function (_, k) {

    }});

})();
</script>
<script>
(function () { var p = (window.__PARAMS || {}).p;
  if (p === 'aviso' || p === 'ingreso') location.replace(window.__BASE + p + '.html' + location.search + location.hash); })();
</script>

<style>
:root{color-scheme:light;--navy:#0E2A47;--teal:#1B7A86;--amb:#B7730F;--red:#B3261E;--grn:#2F6B4F;--ink:#1D2733;--gray:#5B6470;--line:#D5DBE1;--bg:#F4F6F8;--card:#FFFFFF;

*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);font-size:15px}
header{background:var(--navy);color:#fff;padding:8px 14px;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;position:sticky;top:0;z-index:5}
header .logos{display:inline-flex;gap:6px;align-items:center;background:#fff;border-radius:999px;padding:3px;cursor:pointer;transition:box-shadow .3s}header .logos img{height:34px;width:34px;display:block}
header .logos img{animation:lgFlota 4.5s ease-in-out infinite}header .logos.entra img{animation:lgEntra 1.4s cubic-bezier(.2,.8,.2,1) both}
header .logos{transition:transform 1.6s cubic-bezier(.4,0,.2,1),box-shadow .3s;width:40px;height:40px;padding:0;justify-content:center;transform-origin:50% 50%;flex:none}header .logos img{transform-origin:50% 50%}@media (max-width:640px){header .logos{width:36px;height:36px}}header .logos:hover{transform:rotate(360deg);box-shadow:0 0 0 4px rgba(255,255,255,.28)}header .logos.toca{animation:lgToca .45s ease-out}
@keyframes lgEntra{0%{opacity:0;transform:rotate(-220deg) scale(.4)}100%{opacity:1;transform:none}}@keyframes lgFlota{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}

    if (node === 'G4' && d.brecha === 'no') marcar('T8', 'no aplica');
    if (node === 'T9' && d.qr_url && d.qr_url !== p.carpeta_url) setPac({carpeta_url: d.qr_url});
    if (node === 'G9') {
      const yaDer = DB.DERIVACIONES.some(x => x.id_paciente === p.id && x.origen === 'alta');
      if (d.adg && d.adg.startsWith('sí') && !yaDer) {

        opsCrearTareas(P2, [nd('TA')]).forEach(o => ops.push(o));

    if (node === 'T11') { setPac({estado: 'en seguimiento', gestor: d.gestor}); opsCrearTareas(P2, [nd('T12'), nd('T21'), nd('T22')], true).forEach(o => ops.push(o)); }

    if (node === 'T22') {
      // sin fecha el evento no entra en ningún momento del seguimiento: se exige (aproximada si no se conoce el día exacto)
      if (d.reingreso === 'sí' && !d.fecha_reingreso) throw new Error('Indique la fecha del reingreso (aproximada si no se conoce el día exacto).');
      if (Number(d.urgencias) > 0 && !d.fecha_urgencia) throw new Error('Indique la fecha de la primera consulta de urgencia.');
      if (d.muerte === 'sí' && !d.fecha_muerte) throw new Error('Indique la fecha del fallecimiento.');
      setPac({estado: 'cerrado 30 d', estado_30d: d.estado_30d});

      const ya = tipo => DB.EVENTOS.some(e => e.id_paciente === p.id && e.tipo === tipo);
      if (d.reingreso === 'sí' && !ya('reingreso')) ev('reingreso', d.fecha_reingreso, {planificado: d.planificado});
      if (Number(d.urgencias) > 0 && !ya('urgencia')) ev('urgencia', d.fecha_urgencia, {clasificacion: 'no clasificada'});
      if (d.muerte === 'sí' && !ya('fallecimiento')) ev('fallecimiento', d.fecha_muerte);
    }
  }
  guardar(ops, estado === 'hecha' ? 'Registrado: ' + n + ' · ' + p.id : 'Marcada como no aplica');
}

  const L = [ev.titulo_nota + (ev.nodo === 'T12' ? ' - ' + hitoTxt(hito).toUpperCase() : ''), 'Fecha: ' + fecha];
  ev.secciones.forEach(s => {

    s.campos.forEach(c => {
      if (c.nota === false || c.guardar === false || c.k === 'fecha_real') return;
      const x = v[c.k];

      if (x == null || x === '') return;

    datos: extra, registrado: ahora(), registrado_por: nombreUsuario()}});
  if (t && d.resultado === 'logrado') ops.push({tabla: 'TAREAS', registro: {clave: t.clave, estado: 'hecha', fecha_hecha: (d.fecha_real || hoy()).slice(0, 10), hecho_por: nombreUsuario(), datos: {id_contacto: ic, minutos: d.minutos}, actualizado: ahora()}});

function qrSvg(text) {
  const q = qrcode(0, 'M'); q.addData(text); q.make();
  const n = q.getModuleCount(), m = 2; let d = '';
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r, c)) d += 'M' + (c + m) + ' ' + (r + m) + 'h1v1h-1z';
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + (n + 2 * m) + ' ' + (n + 2 * m) + '" shape-rendering="crispEdges" role="img" aria-label="Código QR"><rect width="100%" height="100%" fill="#fff"/><path d="' + d + '" fill="#000"/></svg>';
}

const ESTADO_DOC = {ok: ['completo', 'c-hecha'], pend: ['pendiente', 'c-pend'], hoy: ['para hoy', 'c-hoy'], venc: ['vencido', 'c-venc'], aun: ['aún no corresponde', 'c-aun'], na: ['no aplica', 'c-na']};
function docsDe(p) {

    const ns = nodos.map(nd).filter(Boolean);
    const ts = DB.TAREAS.filter(t => t.id_paciente === p.id && ns.includes(t.n));
    const r = {cod, nombre, ev, ts, estado: 'aun', resp: RESP(P(ns[0])), vence: '', t0: null, fecha: ''};
    if (!ts.length) {
      const g9 = tareaN(p.id, 'G9');
      r.estado = fuera || p.estado === 'cerrado 30 d' || (cod === 'ADG' && g9 && g9.estado !== 'pendiente') ? 'na' : 'aun';
      return r;
    }
    const pend = ts.filter(t => t.estado === 'pendiente').sort(porFecha);
    if (cod === 'F3') r.extra = ts.filter(t => t.estado === 'hecha').length + ' de ' + ts.filter(t => t.estado !== 'no aplica').length + ' llamadas';
    if (!pend.length) { r.estado = ts.every(t => t.estado === 'no aplica') ? 'na' : 'ok'; r.fecha = ts.filter(t => t.estado === 'hecha').map(t => t.fecha_hecha).sort().pop() || ''; return r; }
    r.t0 = pend[0]; r.resp = RESP(P(pend[0].n)); r.vence = pend[0].fecha_debida;
    const e = estadoTarea(pend[0])[1]; r.estado = e === 'c-venc' ? 'venc' : e === 'c-hoy' ? 'hoy' : 'pend';
    return r;
  });
}

}

const VENTANAS = [['72h', '72 h', 3], ['d7', 'día 7', 7], ['d14', 'día 14', 14], ['d21', 'día 21', 21], ['d30', 'día 30', 30]];
const numCfg = k => Number(String(DB.cfg[k] || '').replace(',', '.')) || 0;
function repartoAcumulado(s) {
  const partes = String(s || '').split(';').map(x => x.split(':')).filter(x => x.length === 2).map(([r, n]) => { const [a, b] = r.split('-').map(Number); return {a, b, n: Number(n)}; });
  const tot = partes.reduce((s, x) => s + x.n, 0) || 1;
  return dia => { let acc = 0; partes.forEach(x => { if (dia >= x.b) acc += x.n; else if (dia >= x.a) acc += x.n * (dia - x.a + 1) / (x.b - x.a + 1); }); return acc / tot; };
}
const DESENLACES = [
  ['util', 'Utilización no planificada (reingreso o urgencia)', 'esperable_utilizacion_30d', e => (e.tipo === 'reingreso' && e.planificado !== 'sí') || e.tipo === 'urgencia'],
  ['reing', 'Rehospitalización no planificada', 'esperable_reingreso_30d', e => e.tipo === 'reingreso' && e.planificado !== 'sí'],
  ['urg', 'Consulta de urgencia', 'esperable_urgencia_30d', e => e.tipo === 'urgencia'],

  return {num: con.length, den: elig.length, pct: elig.length ? 100 * con.length / elig.length : null};
}
function serie(fn, claveBase) {

}
function graficoSerie(s) {
  const W = 330, H = 170, L = 34, B = 26, Tt = 14, R = 20;
  const max = Math.min(100, Math.ceil(Math.max(5, ...s.map(x => Math.max(x.esp, x.obs.pct || 0))) * 1.15 / 5) * 5);
  const X = i => L + i * (W - L - R) / (s.length - 1), Y = v => H - B - (v / max) * (H - B - Tt);
  const linea = (f, col, dash) => '<polyline fill="none" stroke="' + col + '" stroke-width="2.2"' + (dash ? ' stroke-dasharray="5 4"' : '') + ' points="' + s.map((x, i) => X(i) + ',' + Y(f(x))).join(' ') + '"/>';
  let g = '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;max-width:420px" role="img" aria-label="Observado frente a esperable y objetivo">';
  [0, max / 2, max].forEach(v => g += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + Y(v) + '" y2="' + Y(v) + '" stroke="#E3E8ED"/><text x="' + (L - 4) + '" y="' + (Y(v) + 4) + '" font-size="10" text-anchor="end" fill="#5B6470">' + v.toFixed(0) + '%</text>');
  s.forEach((x, i) => g += '<text x="' + X(i) + '" y="' + (H - 8) + '" font-size="10.5" text-anchor="middle" fill="#5B6470">' + x.l + '</text>');
  g += linea(x => x.esp, '#8B96A1', true) + linea(x => x.obj, '#2F6B4F', false);
  s.forEach((x, i) => { if (x.obs.pct != null) g += '<circle cx="' + X(i) + '" cy="' + Y(x.obs.pct) + '" r="5" fill="#0E2A47"/><text x="' + X(i) + '" y="' + (Y(x.obs.pct) - 8) + '" font-size="10" text-anchor="middle" fill="#0E2A47">' + x.obs.num + '/' + x.obs.den + '</text>'; });
  return g + '</svg><div class="leg"><span><i style="background:#8B96A1"></i>esperable (línea base)</span><span><i style="background:#2F6B4F"></i>objetivo</span><span><i style="background:#0E2A47;height:8px;width:8px;border-radius:4px"></i>observado (con evento / con ese tiempo de seguimiento)</span></div>';
}

function metaOK(meta, v, codigo) {
  if (v == null) return 'na';
  const m = String(meta).match(/([≥≤])\s?(\d+)%/);
  if (!m) return codigo === 'I16' ? (v === 100 ? 'ok' : 'bad') : 'na';
  return (m[1] === '≥' ? v >= Number(m[2]) : v <= Number(m[2])) ? 'ok' : 'bad';
}

function irDiapo(n) { const tot = diapositivas().length; DIAPO = Math.max(0, Math.min(n, tot - 1)); if (PRESENTADOR) marcarDiapo(); render(); window.scrollTo(0, 0); }

function trasDiapo() {}
let pidiendoDiapo = false;
function pollDiapo() {
  if (VISTA !== 'presentacion' || !SEGUIR || PRESENTADOR || pidiendoDiapo || document.visibilityState !== 'visible') return;
  pidiendoDiapo = true;
  srv('api_diapo').then(n => { pidiendoDiapo = false; if (n !== '' && n != null && Number(n) !== DIAPO && VISTA === 'presentacion') { DIAPO = Number(n); render(); } }).catch(() => { pidiendoDiapo = false; });

let toque = null;
document.addEventListener('touchstart', e => { if (VISTA === 'presentacion') toque = e.changedTouches[0].clientX; }, {passive: true});
document.addEventListener('touchend', e => { if (VISTA !== 'presentacion' || toque == null) return; const dx = e.changedTouches[0].clientX - toque; toque = null; if (Math.abs(dx) > 70) irDiapo(DIAPO + (dx < 0 ? 1 : -1)); }, {passive: true});
document.addEventListener('keydown', e => {
  if (VISTA !== 'presentacion' || /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  if (['ArrowRight', 'PageDown', ' '].includes(e.key)) { e.preventDefault(); irDiapo(DIAPO + 1); }
  if (['ArrowLeft', 'PageUp'].includes(e.key)) { e.preventDefault(); irDiapo(DIAPO - 1); }
});

        {t: 'Decisión y equipo', campos: [T('caso_a_caso', 'Caso a caso: motivo (solo si no cumple la regla)'), elegir('rev_por', 'Revisó la ficha', RE_REV), elegir('hosp_por', 'Lo sigue en el hospital', RE_HOS)]}]},
    T4: {titulo: 'Revisión prealta: ¿entra?', get quien() { return quienF(RE_REV, RESP_SIMPLE.T4); }, cuando: 'Antes del alta',
      prop: 'Mismo formulario que al ingreso, con lo que hay antes del alta: último Barthel (preferir el de terapia ocupacional o kinesiología). Si entra, queda para la Atención 1.',
      secciones: () => [{t: 'Revisión prealta', campos: prealta()},
        {t: 'Si entra: equipo', campos: [elegir('titular', 'Lo sigue hasta el alta', RE_HOS), elegir('gestor', 'Llamadas después del alta', RE_GES)]}]},
    A1: {titulo: EVS.A1.nombre, get quien() { return quienF(RE_HOS, RESP_SIMPLE.T6); }, cuando: 'Antes del alta, con el folleto de alta impreso en la mano', prop: EVS.A1.proposito, secciones: () => EVS.A1.secciones},
    LL: {titulo: EVS.LL_S.nombre, quien: EVS.LL_S.quien, cuando: EVS.LL_S.cuando, prop: EVS.LL_S.proposito, secciones: () => EVS.LL_S.secciones, pauta: true},
    T22: {titulo: 'Revisión a 30 días', get quien() { return RESP_SIMPLE.T22; }, cuando: 'Día 30 desde el alta',
      prop: 'Revisión de la ficha clínica y del Libro de Urgencia: urgencia, hospitalización o fallecimiento en los 30 días posteriores al alta, en el INGER o en otro centro.',
      secciones: () => [{t: 'Estado a 30 días', campos: FORM.T22()}]}
  };
  function formulario(k, id) {
    const d = DEFS[k];
    let h = enc(d.titulo, esc(d.quien) + ' · ' + esc(d.cuando), id) + (d.prop ? '<div class="prop">' + esc(d.prop) + '</div>' : '');
    d.secciones().forEach(s => { h += '<h2>' + esc(s.t) + '</h2>' + (s.guia ? '<div class="nota">' + esc(s.guia) + '</div>' : '') + s.campos.map(campo).join(''); });
    return hoja(h + pie()) + (d.pauta ? pauta() : '');
  }

  // ------------------------------------------------------------ pauta de la llamada (Gestión de Casos)
  function pauta() {
    const conductas = CONDUCTAS.map(c => '<li>' + esc(c) + '</li>').join('');
    const adg = CRIT_ADG.map(c => '<b>' + esc(c.codigo) + '</b> ' + esc(c.nombre)).join(' · ');
    const esp = Object.keys(ALARMAS).filter(k => k !== 'Generales').map(k => '<li><b>' + esc(k) + ':</b> ' + esc(ALARMAS[k]) + '</li>').join('');
    return hoja(enc('Pauta de la llamada', 'Gestión de Casos · 48–96 h, día 7, día 14 (se puede omitir) y día 21') +
      '<div class="dos"><div>' +
      '<div class="caja v"><h3>Antes de marcar</h3><ul><li>Tener a la vista la receta del alta y lo registrado en la llamada anterior.</li><li>Llamar desde el celular de Gestión de Casos (' + esc(telEquipo()) + '), que es el número que el paciente guardó.</li></ul></div>' +
      '<div class="caja r" style="margin-top:7px"><h3>1. Primero, descartar urgencia</h3><p style="margin:2px 0">' + esc(ALARMAS.Generales || '') + '</p><p style="margin:2px 0">Signo de gravedad: urgencia o SAMU 131, sin esperar.</p></div>' +
      '<div class="caja" style="margin-top:7px"><h3>2. Revisar, con preguntas abiertas</h3><ul>' +
      '<li><b>Medicamentos:</b> preguntar por tres por su nombre («¿cómo está tomando…?»). «¿Está tomando sus remedios?» siempre da que sí.</li>' +
      '<li><b>Controles:</b> «¿Ya tiene la hora? ¿Quién lo va a llevar?» (especialidad y APS).</li>' +
      '<li><b>Síntomas de descompensación</b> según su enfermedad (ver al lado).</li>' +
      '<li><b>Indicaciones no farmacológicas:</b> alimentación, actividad.</li>' +
      '<li><b>Cuidador:</b> «¿Le ha resultado pesado?»</li>' +
      '<li><b>Teach-back pendiente:</b> si no se logró antes del alta, se completa en esta llamada.</li></ul></div>' +
      '<div class="caja a" style="margin-top:7px"><h3>3. Desde el alta o la última llamada</h3><p style="margin:2px 0">«¿Consultó en alguna urgencia o quedó hospitalizado, en el INGER o en otro lugar?» Registrar la fecha. Si hubo rehospitalización, sale del seguimiento y puede volver a entrar al alta de esa hospitalización.</p></div>' +
      '</div><div>' +
      '<div class="caja"><h3>Síntomas de descompensación según la enfermedad</h3><ul>' + esp + '</ul></div>' +
      '<div class="caja v" style="margin-top:7px"><h3>4. Conducta (una por llamada)</h3><ul>' + conductas + '</ul>' +
      '<p style="margin:3px 0 0">Descompensación: flujo habitual. Médico post-alta telefónico e interconsulta a UGA si corresponde; APS o urgencia según gravedad.</p></div>' +
      '<div class="caja" style="margin-top:7px"><h3>ADG si hay criterio</h3><p style="margin:2px 0">' + adg + '.</p></div>' +
      '<div class="caja" style="margin-top:7px"><h3>5. Al cortar</h3><ul><li>Registrar en el portal el mismo día y copiar el texto a la ficha clínica.</li><li>Si no contesta: registrar «fallido» y volver a intentar. Tres intentos fallidos en dos días, con riesgo, es criterio C5.</li><li>La llamada lograda del día 21 cierra el seguimiento.</li></ul></div>' +
      '</div></div>' + pie(), 'pauta');
  }

  // ------------------------------------------------------------ carnet (plegable, tamaño tarjeta) y plan del paciente
  function fechasLlamadas(p) {
    return HITOS.map(([k, l]) => { const t = p ? tareaN(p.id, 'T12', k) : null; return [l, t && t.estado !== 'no aplica' ? t.fecha_debida : '', t && t.estado === 'no aplica']; });
  }
  function carnet(p) {
    const filas = fechasLlamadas(p).map(([l, f, omit]) => '<tr><td>' + esc(l.replace(/^48–\d+ h$/, 'Primera llamada')) + '</td><td><b>' + (omit ? 'no corresponde' : f ? esc(fechaLarga(f)) : '______________') + '</b></td></tr>').join('');
    const qr = qrVigente() ? '<div class="qrc">' + QR_CONTACTO + 'Escanee para guardar el contacto</div>' : '';
    const generales = String(ALARMAS.Generales || '');
    const urg = generales.indexOf('Vaya a urgencia') >= 0 ? generales.slice(generales.indexOf('Vaya a urgencia')) : 'Vaya a urgencia o llame al SAMU 131 si tiene dificultad para respirar, dolor en el pecho, pérdida de conciencia o debilidad súbita de un lado del cuerpo.';
    return '<div class="carnet"><div class="cara"><div class="u">Unidad Geriátrica de Agudos · INGER</div><div class="t">Seguimiento después del alta</div>' +
      '<div class="hor">Gestión de Casos lo llamará desde este número:</div><div class="tel">' + esc(telEquipo()) + '</div>' +
      '<div class="hor">' + esc(horarioEquipo().replace(/^./, c => c.toUpperCase())) + '. También por WhatsApp.</div>' +
      '<div class="guarda">Guárdelo en su teléfono como <b>«Gestión de Casos INGER»</b> para reconocer la llamada.</div>' + qr +
      (p ? '<div class="cod">' + esc(p.id) + '</div>' : '') + '</div>' +
      '<div class="cara"><div class="t" style="margin-top:0">Sus llamadas</div><table>' + filas + '</table>' +
      '<div class="al">Si tiene dudas, llame o escriba en ese horario.</div><div class="al"><b>' + esc(urg) + '</b></div></div></div>' +
      '<div class="corte">Recortar por la línea punteada y doblar por el centro. Sin datos clínicos ni del paciente.</div>';
  }
  function hojaCarnet(p) {
    return hoja(enc('Carnet del paciente', p ? 'Fechas tomadas del portal el ' + dm(hoy()) : 'Formato en blanco: escribir las fechas de las llamadas', p && p.id) + carnet(p) + carnet(p) +
      pie(qrVigente() ? 'El QR guarda el contacto de Gestión de Casos INGER en el teléfono del paciente o del cuidador.' : 'El QR no se imprime porque el teléfono del equipo cambió en CONFIG.'));
  }
  function planPaciente(p) {
    const L = pasosSimple(p);
    const filas = L.map(x => '<tr><td><b>' + esc(x.nombre) + '</b></td><td>' + esc(RESP_SIMPLE[x.nodo] || '') + '</td><td>' + esc(x.t.fecha_debida ? fechaLarga(x.t.fecha_debida) : '—') + '</td><td>' + esc(estadoTarea(x.t)[0]) + '</td></tr>').join('');
    return hoja(enc('Plan de seguimiento', 'Ingreso ' + dm(p.fecha_ingreso) + ' · alta ' + dm(p.fecha_alta) + ' · estado: ' + esc(p.estado || ''), p.id) +
      '<table><tr><th>Paso</th><th>Quién</th><th>Fecha</th><th>Estado</th></tr>' + filas + '</table>' +
      '<div class="caja v" style="margin-top:9px"><b>Gestión de Casos:</b> agendar cada llamada en su agenda con el código ' + esc(p.id) + '. Celular del equipo: ' + esc(telEquipo()) + ' (' + esc(horarioEquipo()) + '). ' +
      'Las llamadas que caen en fin de semana se adelantan al viernes.</div>' + pie('Las fechas son las del portal al momento de imprimir; si cambia la fecha de alta, se recalculan en el portal.'));
  }

  // ------------------------------------------------------------ guía rápida del portal
  function guia() {
    return hoja(enc('Cómo usar el portal', 'Desde el PC, el teléfono o la tablet. Mismo enlace para todos.') +
      '<div class="qrs"><figure class="qr">' + QR_PORTAL + '<figcaption><b>Portal VIGÍA</b><br>seguimiento del equipo</figcaption></figure>' +
      '<figure class="qr">' + QR_VGI + '<figcaption><b>VGI de ingreso UGA</b><br>para el médico que ingresa</figcaption></figure>' +
      '<div style="flex:1;min-width:60mm"><h3 style="margin-top:0">Primera vez en cada equipo</h3><ol><li>Escanee el QR con la cámara (o abra el enlace que le enviaron).</li>' +
      '<li>En el teléfono: Compartir → «Agregar a pantalla de inicio».</li><li>Toque «¿Quién eres?» y elija su nombre: queda guardado en ese equipo.</li>' +
      (cfg('clave_acceso') ? '<li>Escriba la clave del equipo cuando la pida (una vez por equipo).</li>' : '') +
      '</ol><p class="nota">Nunca escriba en el portal el nombre, el RUT, el teléfono ni la dirección del paciente: solo el código VG.</p></div></div>' +
      '<h2>Qué hace cada uno</h2>' +
      '<div class="rol"><b class="q">Revisión de ficha · ' + esc(RESP_SIMPLE.T1) + '</b><br>«Hoy» → «Candidatos por revisar»: Agregar o Descartar. También «+ Agregar paciente». Al ingreso: «Revisión de ficha al ingreso». Antes del alta: «Revisión prealta: ¿entra?», con el último Barthel (preferir terapia ocupacional o kinesiología).</div>' +
      '<div class="rol"><b class="q">Atención 1 · ' + esc(RESP_SIMPLE.T6) + '</b><br>Antes del alta, después de las educaciones: presentación, teach-back de medicamentos y horas de control, verificación de los datos de contacto en la ficha y celular de Gestión de Casos guardado. Si acepta, el portal programa las 4 llamadas y la revisión a 30 días.</div>' +
      '<div class="rol" style="border-left-color:#6A4C93"><b class="q">Llamadas · Gestión de Casos</b><br>«Hoy» → filtro «Gestión de Casos» → «Registrar». 48–96 h, día 7, día 14 (se puede omitir) y día 21. La llamada lograda del día 21 cierra el seguimiento. El portal arma el texto para pegar en la ficha.</div>' +
      '<div class="rol" style="border-left-color:#2B3440"><b class="q">Revisión a 30 días · ' + esc(RESP_SIMPLE.T22) + '</b><br>Ficha clínica y Libro de Urgencia: urgencia, hospitalización o fallecimiento en los 30 días posteriores al alta.</div>' +
      '<div class="rol" style="border-left-color:#0E2A47"><b class="q">Médicos de la UGA · VGI de ingreso</b><br>Se pega el texto de la ficha, se completa y se copia el texto armado a la ficha. No guarda datos. Si el paciente cumple el tamizaje, avisa al equipo solo con iniciales, edad, fecha y criterios.</div>' +
      '<h2>Formularios para imprimir</h2><p>Menú «Formularios» → «Imprimir o guardar PDF». Desde la ficha de un paciente: «Imprimir plan» y «Imprimir carnet». Para descargar, elija «Guardar como PDF» en la ventana de impresión.</p>' +
      pie());
  }

  // ------------------------------------------------------------ abrir para imprimir
  function abrir(titulo, cuerpo) {
    const html = '<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>' + esc(titulo) + '</title><style>' + CSS + '</style></head><body>' +
      '<div class="barra no-imp"><b>' + esc(titulo) + '</b><button onclick="window.print()">Imprimir o guardar PDF</button><span>Para descargar, elija «Guardar como PDF» al imprimir.</span></div>' + cuerpo + '</body></html>';
    let w = null;
    try { w = window.open('', '_blank'); } catch (e) { w = null; }
    if (w) {
      try { w.document.open(); w.document.write(html); w.document.close(); setTimeout(() => { try { w.focus(); w.print(); } catch (e) {} }, 500); return; } catch (e) {}
    }
    try { // si el navegador bloquea la ventana nueva: se descarga el archivo para abrirlo e imprimirlo
      const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([html], {type: 'text/html'})); a.download = titulo.replace(/[^\wáéíóúñÁÉÍÓÚÑ ·-]/g, '') + '.html';
      document.body.appendChild(a); a.click(); setTimeout(() => a.remove(), 1500);
      toast('Se descargó el formulario: ábralo para imprimirlo o guardarlo como PDF.', 7000);
    } catch (e) { toast('No se pudo abrir el formulario: ' + e.message, 7000); }
  }
  const DOCS = [
    ['T1', 'Revisión de ficha al ingreso', 'Revisión de ingresos', () => formulario('T1')],
    ['T4', 'Revisión prealta: ¿entra?', 'Revisión de ingresos', () => formulario('T4')],
    ['A1', 'Atención 1 antes del alta', 'Seguimiento hospitalario', () => formulario('A1')],
    ['LL', 'Llamada de seguimiento + pauta de la llamada', 'Gestión de Casos', () => formulario('LL')],
    ['T22', 'Revisión a 30 días', RESP_SIMPLE.T22, () => formulario('T22')],
    ['GUIA', 'Cómo usar el portal (con QR)', 'Para todo el equipo', () => guia()]
  ];
  window.vigiaImp = {
    doc(k) { const d = DOCS.find(x => x[0] === k); if (d) abrir(d[1], d[3]()); },
    todo() { abrir('Formularios del seguimiento VIGÍA', DOCS.map(d => d[3]()).join('')); },
    plan(id) { const p = pac(id); if (p) abrir('Plan de seguimiento ' + p.id, planPaciente(p)); },
    carnet(id) { const p = pac(id); if (p) abrir('Carnet ' + p.id, hojaCarnet(p)); }
  };

  // ------------------------------------------------------------ vista «Formularios» y enlaces
  function vFormularios() {
    return '<h2>Formularios para imprimir</h2><p class="note">Todo se registra en el portal, desde el PC, el teléfono o la tablet. Estos formularios son una copia de referencia, por si alguien quiere tenerlos en papel; no se llenan a mano. ' +
      'Se arman con los mismos campos del portal. Para descargar, elija «Guardar como PDF» en la ventana de impresión.</p>' +
      '<div class="card lista">' + DOCS.map(d => '<div class="li"><div class="tx"><b>' + esc(d[1]) + '</b><div class="t3">' + esc(d[2]) + '</div></div><button class="btn sm" onclick="vigiaImp.doc(' + js(d[0]) + ')">Imprimir o PDF</button></div>').join('') + '</div>' +
      '<div class="row" style="margin-top:10px"><button class="btn" onclick="vigiaImp.todo()">Todo en un solo PDF</button></div>' +
      '<p class="note" style="margin-top:12px">El plan y el folleto de alta de cada paciente, con sus fechas de llamada, se imprimen desde su ficha (Pacientes → paciente → Resumen de alta).</p>';
  }
  const render0 = render, nav0 = nav, menuMas0 = menuMas, vCasoSimple0 = vCasoSimple;
  render = function () {
    if (VISTA === 'formularios' && DB) { nav(); $('#app').innerHTML = vFormularios(); return; }
    return render0.apply(this, arguments);
  };
  nav = function () {
    nav0.apply(this, arguments);
    try {
      const on = VISTA === 'formularios' ? ' class="on"' : '';
      const ext = $('#nav a.ext');
      const b = '<button' + on + ' onclick="ir(\'formularios\')">Formularios para imprimir</button>';
      if (ext) ext.insertAdjacentHTML('beforebegin', b); else $('#nav').insertAdjacentHTML('beforeend', b);
      if (SIMPLE()) {
        const tb = $('#tabbar'), mas = tb && tb.lastElementChild;
        const t = '<button class="' + (VISTA === 'formularios' ? 'on' : '') + '" onclick="ir(\'formularios\')">' + ICON.evaluaciones + '<span>Para imprimir</span></button>';
        if (mas) mas.insertAdjacentHTML('beforebegin', t);
        if (VISTA === 'formularios' && tb) [...tb.querySelectorAll('button')].forEach(x => { if (!/Formularios/.test(x.textContent)) x.classList.remove('on'); });
      }
    } catch (e) {}
  };
  menuMas = function () {
    menuMas0.apply(this, arguments);
    try { const m = $('#mbox .menu-mas'); if (m) m.insertAdjacentHTML('afterbegin', '<button class="btn sec" onclick="cerrar();ir(\'formularios\')">Formularios para imprimir</button>'); } catch (e) {}
  };
  vCasoSimple = function (p) {
    return vCasoSimple0.apply(this, arguments) + '<div class="row" style="margin-top:12px"><button class="btn sec" onclick="vigiaImp.plan(' + js(p.id) + ')">Imprimir plan</button>' +
      '<button class="btn sec" onclick="vigiaImp.carnet(' + js(p.id) + ')">Imprimir carnet</button></div>';
  };
  if (DB) render();
})();

</script>
<script>
// ============================================================ ajustes acordados el 05-oct-2026
// 1.ª llamada de seguimiento entre 48 y 96 h: las altas del jueves se llaman el lunes (CONFIG · tolerancia_72h_jue_vie = 4).
(function () {
  const A = s => typeof s === 'string' ? s.replace(/48–72 h/g, '48–96 h').replace(/ \(Dra\. Fernanda Meneses; Dra\. Rocío[^)]*\)/g, '') : s;
  try {
    HITOS.forEach(h => { if (h[0] === '72h') h[1] = '48–96 h'; });
    [EVS.A1, EVS.LL_S].forEach(ev => { if (!ev) return; ev.cuando = A(ev.cuando); ev.proposito = A(ev.proposito); (ev.secciones || []).forEach(s => { s.guia = A(s.guia); (s.campos || []).forEach(c => { c.l = A(c.l); c.guia = A(c.guia); }); }); });
    (CATALOGO.proceso || []).forEach(r => Object.keys(r).forEach(k => { r[k] = A(r[k]); }));
  } catch (e) {}
  const norm0 = normalizar;
  normalizar = function () {
    const d = norm0.apply(this, arguments);
    try { (d.PROCESO || []).forEach(r => Object.keys(r).forEach(k => { r[k] = A(r[k]); })); } catch (e) {}
    return d;
  };
})();
</script>
<script>
// ============================================================ v11 · 15-oct-2026
// RUT del paciente tras una clave aparte (acuerdo 05-10): se pide paciente por paciente, no viaja con los datos del portal
// ni se guarda en el dispositivo; la clave se vuelve a pedir cada CONFIG · rut_horas (por defecto 4 h). Cada consulta queda en la bitácora.
(function () {
  const HORAS = () => Math.max(1, Number((DB && DB.cfg && DB.cfg.rut_horas) || 4));
  const claveRut = () => { try { const s = JSON.parse(sessionStorage.getItem('vigia_rut') || 'null'); if (s && s.hasta > Date.now()) return s.k; } catch (e) {} return ''; };
  const fijar = k => { try { sessionStorage.setItem('vigia_rut', JSON.stringify({k, hasta: Date.now() + HORAS() * 3600e3})); } catch (e) {} };
  const olvidar = () => { try { sessionStorage.removeItem('vigia_rut'); } catch (e) {} };
  function pedir(id, err) {
    modal('<h2>RUT · ' + esc(id) + '</h2><p class="note">Clave del RUT (distinta de la del equipo). Se vuelve a pedir cada ' + HORAS() + ' h. Cada consulta queda registrada.</p>' +
      (err ? '<div class="alert">' + esc(err) + '</div>' : '') + '<label for="f_krut">Clave del RUT</label><input id="f_krut" type="password" autocomplete="off">' +
      '<div class="row" style="margin-top:12px"><button class="btn" id="bok">Ver RUT</button><button class="btn sec" onclick="cerrar()">Cancelar</button></div>');
    $('#f_krut').focus();
    $('#f_krut').addEventListener('keydown', e => { if (e.key === 'Enter') $('#bok').click(); });
    $('#bok').onclick = () => { const k = $('#f_krut').value.trim(); if (k) mostrar(id, k); };
  }
  async function mostrar(id, k) {
    try {
      const r = await srv('api_rut', 'ver', id, '', k);
      if (k) fijar(k); IDENT[id] = {rut: r.rut || '', nombre: r.nombre || ''}; ficha(id, r.rut || '', r.nombre || '');
    } catch (e) { const m = String(e); if (/RUTCLAVE/.test(m)) { olvidar(); pedir(id, 'La clave del RUT no coincide.'); } else { olvidar(); modal('<h2>RUT</h2><div class="alert">' + esc(m.replace(/^Error:\s*/, '')) + '</div><div class="row" style="margin-top:12px"><button class="btn sec" onclick="cerrar()">Cerrar</button></div>'); } }
  }
  function ficha(id, rut, nombre) {
    modal('<h2>' + esc(id) + '</h2>' + (rut || nombre ? '<div class="card"><div style="font-size:20px;font-weight:700">' + esc(nombre || '—') + '</div><div style="font-size:24px;font-weight:700;letter-spacing:.5px" id="rutv">' + esc(rut || '—') + '</div></div>' + (rut ? '<div class="row"><button class="btn sec sm" id="bcp">Copiar RUT</button></div>' : '') : '<div class="card">Sin nombre ni RUT registrados para este código.</div>') +
      '<details' + (rut ? '' : ' open') + '><summary>' + (rut ? 'Corregir nombre o RUT' : 'Registrar nombre y RUT') + '</summary><label for="f_nom">Nombre</label><input id="f_nom" autocomplete="off" value="' + esc(nombre || '') + '"><label for="f_rut">RUT (con dígito verificador)</label><input id="f_rut" autocomplete="off" placeholder="12.345.678-5" value="' + esc(rut || '') + '"><div class="row" style="margin-top:8px"><button class="btn sm" id="bgr">Guardar</button></div></details>' +
